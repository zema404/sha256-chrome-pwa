<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Mon adresse IP</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#070b18;--panel2:rgba(255,255,255,.14);--text:#f8fafc;--muted:#a7b0c4;--line:rgba(255,255,255,.16);--brand:#7c3aed;--brand2:#06b6d4;--danger:#fb7185;--ok:#34d399;--radius:24px;--shadow:0 22px 80px rgba(0,0,0,.38)}
    *{box-sizing:border-box}html,body{min-height:100%}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 10%,rgba(124,58,237,.38),transparent 34%),radial-gradient(circle at 88% 18%,rgba(6,182,212,.26),transparent 28%),linear-gradient(145deg,#070b18 0%,#101529 52%,#080b13 100%);padding:18px}
    .shell{width:min(720px,100%);margin:0 auto;min-height:calc(100vh - 36px);display:grid;place-items:center}
    .card{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}
    header{padding:28px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
    .logo{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,var(--brand),var(--brand2));font-weight:900;font-size:26px;box-shadow:0 14px 34px rgba(124,58,237,.35)}
    h1{margin:0;font-size:clamp(26px,5vw,42px);line-height:1;letter-spacing:-.05em}
    .subtitle{margin:8px 0 0;color:var(--muted);font-size:15px}
    main{padding:28px;display:grid;gap:18px}
    .box{border:1px solid var(--line);border-radius:22px;background:rgba(7,11,24,.42);padding:18px}
    label{display:block;font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .ip{width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.26);color:var(--text);padding:16px;font:700 clamp(18px,4vw,26px)/1.3 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;word-break:break-all;min-height:60px;display:flex;align-items:center}
    .ip.loading{color:var(--muted);font-weight:500;font-size:16px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    button{border:1px solid var(--line);color:var(--text);background:var(--panel2);padding:13px 15px;border-radius:15px;font-weight:800;cursor:pointer;transition:transform .12s,background .12s;touch-action:manipulation}
    button:active{transform:scale(.98)}button:hover{background:rgba(255,255,255,.16)}
    button.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2))}
    .status{min-height:24px;margin-top:4px;color:var(--muted);font-size:14px}
    .status.ok{color:var(--ok)}.status.err{color:var(--danger)}
    .hint{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
    footer{padding:0 28px 24px;color:var(--muted);font-size:12px;text-align:center}
    a{color:#a5b4fc}
    @media(max-width:840px){body{padding:12px}.shell{min-height:calc(100vh - 24px)}header,main{padding:20px}}
  </style>
</head>
<body>
  <div class="shell">
    <section class="card" aria-label="Votre adresse IP publique">
      <header>
        <div class="logo">IP</div>
        <div>
          <h1>Mon adresse IP</h1>
          <p class="subtitle">Votre adresse IP publique, telle que vue depuis Internet.</p>
        </div>
      </header>
      <main>
        <div class="box">
          <label>Adresse IPv4</label>
          <div id="ipv4" class="ip loading">Détection en cours…</div>
          <div class="actions"><button id="copy4" class="primary" type="button">Copier</button></div>
        </div>
        <div class="box">
          <label>Adresse IPv6</label>
          <div id="ipv6" class="ip loading">Détection en cours…</div>
          <div class="actions"><button id="copy6" class="primary" type="button">Copier</button></div>
          <p class="hint">Si votre connexion n’a pas d’IPv6, la même adresse IPv4 peut s’afficher, ou rien du tout.</p>
        </div>
        <div class="box">
          <div class="actions" style="margin-top:0">
            <button id="refresh" type="button">Actualiser</button>
            <button onclick="location.href='index.html'" type="button">← Retour SHA-256</button>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </main>
      <footer>Détection via <a href="https://www.ipify.org" rel="noopener" target="_blank">ipify.org</a>. Nécessite une connexion Internet.</footer>
    </section>
  </div>

  <script>
    const ipv4El=document.getElementById('ipv4'),ipv6El=document.getElementById('ipv6'),statusEl=document.getElementById('status');

    function setStatus(m,t=''){statusEl.textContent=m;statusEl.className='status'+(t?' '+t:'')}

    async function fetchIp(url){
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),8000);
      try{
        const res=await fetch(url,{signal:controller.signal,cache:'no-store'});
        if(!res.ok)throw new Error('HTTP '+res.status);
        return (await res.json()).ip;
      }finally{clearTimeout(timeout)}
    }

    async function load(){
      ipv4El.textContent='Détection en cours…';ipv4El.classList.add('loading');
      ipv6El.textContent='Détection en cours…';ipv6El.classList.add('loading');
      setStatus('');
      const [v4,v6]=await Promise.allSettled([
        fetchIp('https://api.ipify.org?format=json'),
        fetchIp('https://api64.ipify.org?format=json')
      ]);
      if(v4.status==='fulfilled'){ipv4El.textContent=v4.value;ipv4El.classList.remove('loading')}
      else ipv4El.textContent='Indisponible';
      if(v6.status==='fulfilled'){ipv6El.textContent=v6.value;ipv6El.classList.remove('loading')}
      else ipv6El.textContent='Indisponible';
      if(v4.status==='rejected'&&v6.status==='rejected')setStatus('Impossible de détecter votre IP. Vérifiez votre connexion Internet.','err');
      else setStatus('Adresse IP détectée.','ok');
    }

    async function copyIp(el){
      const value=el.textContent;
      if(!value||el.classList.contains('loading')||value==='Indisponible'){setStatus('Aucune adresse à copier.','err');return}
      try{await navigator.clipboard.writeText(value);setStatus('Adresse copiée dans le presse-papiers.','ok')}
      catch{setStatus('Copie impossible.','err')}
    }

    document.getElementById('copy4').addEventListener('click',()=>copyIp(ipv4El));
    document.getElementById('copy6').addEventListener('click',()=>copyIp(ipv6El));
    document.getElementById('refresh').addEventListener('click',load);
    load();
  </script>
</body>
</html>
